<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZeroClaw 3D Monitor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: #0ff; }

  #hud {
    position: fixed; top: 20px; left: 20px;
    background: rgba(0,0,0,0.75);
    border: 1px solid #0ff4;
    border-radius: 8px;
    padding: 14px 18px;
    min-width: 220px;
    font-size: 12px;
    line-height: 1.9;
    pointer-events: none;
    backdrop-filter: blur(6px);
  }
  #hud h2 { color: #0ff; font-size: 13px; margin-bottom: 8px; letter-spacing: 3px; }
  .node-status { display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #0f0; box-shadow: 0 0 6px #0f0; }
  .dot.offline { background: #f00; box-shadow: 0 0 6px #f00; }
  .dot.error   { background: #ff0; box-shadow: 0 0 6px #ff0; }

  #log {
    position: fixed; bottom: 20px; left: 20px;
    background: rgba(0,0,0,0.75);
    border: 1px solid #0ff4;
    border-radius: 8px;
    padding: 10px 14px;
    width: 440px;
    font-size: 11px;
    line-height: 1.7;
    max-height: 160px;
    overflow: hidden;
    backdrop-filter: blur(6px);
  }
  #log h3 { color: #0ff; margin-bottom: 6px; font-size: 11px; letter-spacing: 2px; }
  .log-entry.blocked    { color: #f44; }
  .log-entry.approved   { color: #4f4; }
  .log-entry.message_in { color: #4af; }
  .log-entry.error      { color: #fa4; }
  .log-entry.info       { color: #aaa; }

  #title {
    position: fixed; top: 20px; right: 20px;
    text-align: right; pointer-events: none;
  }
  #title h1 { font-size: 24px; color: #0ff; letter-spacing: 5px; text-shadow: 0 0 30px #0ff; }
  #title p  { font-size: 11px; color: #0ff8; letter-spacing: 3px; }

  #stats {
    position: fixed; bottom: 20px; right: 20px;
    background: rgba(0,0,0,0.75);
    border: 1px solid #0ff4;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 12px;
    line-height: 1.9;
    text-align: right;
    backdrop-filter: blur(6px);
  }
  #stats h3 { color: #0ff; font-size: 11px; letter-spacing: 2px; margin-bottom: 4px; }
  .sv { color: #fff; }
  .sb { color: #f44; }

  #loading {
    position: fixed; inset: 0; background: #000510;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px; z-index: 99;
    transition: opacity 1s;
  }
  #loading h2 { color: #0ff; letter-spacing: 4px; font-size: 20px; }
  #loading p  { color: #0ff8; font-size: 12px; letter-spacing: 2px; }
  .bar { width: 200px; height: 2px; background: #0ff2; border-radius: 2px; overflow: hidden; }
  .bar-fill { height: 100%; background: #0ff; animation: load 2s ease forwards; }
  @keyframes load { from { width: 0; } to { width: 100%; } }
</style>
</head>
<body>

<div id="loading">
  <h2>ZEROCLAW</h2>
  <div class="bar"><div class="bar-fill"></div></div>
  <p>INITIALIZING 3D MONITOR...</p>
</div>

<div id="hud">
  <h2>⬡ NODE STATUS</h2>
  <div class="node-status"><span class="dot" id="dot-slack"></span> Slack Bridge</div>
  <div class="node-status"><span class="dot" id="dot-metaclaw"></span> MetaClaw</div>
  <div class="node-status"><span class="dot" id="dot-zeroclaw"></span> ZeroClaw</div>
  <div class="node-status"><span class="dot" id="dot-ollama"></span> Ollama</div>
</div>

<div id="title">
  <h1>ZEROCLAW</h1>
  <p>3D PIPELINE MONITOR</p>
</div>

<div id="log">
  <h3>▶ LIVE EVENTS</h3>
  <div id="log-entries"></div>
</div>

<div id="stats">
  <h3>SESSION STATS</h3>
  Messages: <span class="sv" id="stat-msgs">0</span><br>
  Approved: <span class="sv" id="stat-approved">0</span><br>
  Blocked:  <span class="sb" id="stat-blocked">0</span><br>
  Skills:   <span class="sv">136</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
// ── Renderer ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000510);
scene.fog = new THREE.FogExp2(0x000510, 0.012);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 500);
camera.position.set(0, 12, 35);
camera.lookAt(0, 2, 0);

// ── Lights ────────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x0a1a2a, 4));
const sunLight = new THREE.DirectionalLight(0x4488ff, 1.5);
sunLight.position.set(10, 20, 10);
sunLight.castShadow = true;
scene.add(sunLight);

const rimLight = new THREE.DirectionalLight(0x00ffff, 0.6);
rimLight.position.set(-10, 5, -10);
scene.add(rimLight);

// ── Neon grid floor ───────────────────────────────────────────────────────────
function makeGrid() {
  const size = 80, div = 40;
  const geo = new THREE.BufferGeometry();
  const verts = [];
  const step = size / div;
  for (let i = 0; i <= div; i++) {
    const v = -size/2 + i * step;
    verts.push(-size/2, 0, v,  size/2, 0, v);
    verts.push(v, 0, -size/2,  v, 0,  size/2);
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  return new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
    color: 0x003355, transparent: true, opacity: 0.5
  }));
}
const grid = makeGrid();
grid.position.y = -4;
scene.add(grid);

// Glowing floor plane
const floorGeo = new THREE.PlaneGeometry(80, 80);
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x001122, metalness: 0.8, roughness: 0.2,
  transparent: true, opacity: 0.6,
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -4.05;
floor.receiveShadow = true;
scene.add(floor);

// ── Stars ─────────────────────────────────────────────────────────────────────
const starGeo = new THREE.BufferGeometry();
const sv = [];
for (let i = 0; i < 4000; i++)
  sv.push((Math.random()-0.5)*600, (Math.random()-0.5)*300, (Math.random()-0.5)*600);
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(sv, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.25, transparent: true, opacity: 0.8 })));

// ── Matrix rain ───────────────────────────────────────────────────────────────
const rainGeo = new THREE.BufferGeometry();
const rainVerts = [], rainSpeeds = [];
for (let i = 0; i < 600; i++) {
  rainVerts.push((Math.random()-0.5)*120, Math.random()*60 - 10, (Math.random()-0.5)*120);
  rainSpeeds.push(0.05 + Math.random() * 0.15);
}
rainGeo.setAttribute('position', new THREE.Float32BufferAttribute(rainVerts, 3));
const rain = new THREE.Points(rainGeo, new THREE.PointsMaterial({
  color: 0x00ff88, size: 0.15, transparent: true, opacity: 0.35
}));
scene.add(rain);

// ── Humanoid figure builder ───────────────────────────────────────────────────
function buildHuman(color, accentColor) {
  const group = new THREE.Group();
  const mat   = new THREE.MeshPhongMaterial({ color, emissive: color, emissiveIntensity: 0.3, shininess: 80 });
  const accent = new THREE.MeshPhongMaterial({ color: accentColor, emissive: accentColor, emissiveIntensity: 0.6, shininess: 120 });

  // Torso
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.3, 0.5), mat);
  torso.position.y = 1.15; torso.castShadow = true;
  group.add(torso);

  // Head
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.38, 12, 12), mat);
  head.position.y = 2.25; head.castShadow = true;
  group.add(head);

  // Visor / face plate
  const visor = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.15, 0.12), accent);
  visor.position.set(0, 2.28, 0.32);
  group.add(visor);

  // Eye glow left
  const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 6), accent);
  eyeL.position.set(-0.13, 2.28, 0.36);
  group.add(eyeL);

  // Eye glow right
  const eyeR = eyeL.clone();
  eyeR.position.set(0.13, 2.28, 0.36);
  group.add(eyeR);

  // Pelvis
  const pelvis = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.4, 0.45), mat);
  pelvis.position.y = 0.4; pelvis.castShadow = true;
  group.add(pelvis);

  // Left upper arm
  const luArm = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.11, 0.7, 8), mat);
  luArm.position.set(-0.62, 1.55, 0); luArm.castShadow = true;
  group.add(luArm);

  // Left lower arm
  const llArm = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.09, 0.6, 8), mat);
  llArm.position.set(-0.62, 0.9, 0); llArm.castShadow = true;
  group.add(llArm);

  // Right upper arm
  const ruArm = luArm.clone();
  ruArm.position.set(0.62, 1.55, 0);
  group.add(ruArm);

  // Right lower arm
  const rlArm = llArm.clone();
  rlArm.position.set(0.62, 0.9, 0);
  group.add(rlArm);

  // Left thigh
  const lThigh = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.13, 0.75, 8), mat);
  lThigh.position.set(-0.25, -0.18, 0); lThigh.castShadow = true;
  group.add(lThigh);

  // Left shin
  const lShin = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.09, 0.72, 8), mat);
  lShin.position.set(-0.25, -0.95, 0); lShin.castShadow = true;
  group.add(lShin);

  // Right thigh
  const rThigh = lThigh.clone(); rThigh.position.set(0.25, -0.18, 0);
  group.add(rThigh);

  // Right shin
  const rShin = lShin.clone(); rShin.position.set(0.25, -0.95, 0);
  group.add(rShin);

  // Shoulder pads
  const shPad = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 8), accent);
  const shPadR = shPad.clone();
  shPad.position.set(-0.65, 1.85, 0);
  shPadR.position.set(0.65, 1.85, 0);
  group.add(shPad); group.add(shPadR);

  // Platform
  const platform = new THREE.Mesh(
    new THREE.CylinderGeometry(1.2, 1.4, 0.15, 16),
    new THREE.MeshPhongMaterial({ color: accentColor, emissive: accentColor, emissiveIntensity: 0.4, transparent: true, opacity: 0.7 })
  );
  platform.position.y = -1.45;
  group.add(platform);

  // Platform glow ring
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(1.3, 0.04, 8, 32),
    new THREE.MeshBasicMaterial({ color: accentColor, transparent: true, opacity: 0.8 })
  );
  ring.position.y = -1.38;
  ring.rotation.x = Math.PI / 2;
  group.add(ring);

  // Store refs for animation
  group.userData = {
    luArm, llArm, ruArm, rlArm,
    lThigh, lShin, rThigh, rShin,
    head, eyeL, eyeR, ring,
    mat, accent: shPad.material,
    baseColor: color, accentColor,
    phase: Math.random() * Math.PI * 2,
    animSpeed: 0.8 + Math.random() * 0.4,
  };
  return group;
}

// ── Create figures ────────────────────────────────────────────────────────────
const FIGURES = {
  slack:    { fig: buildHuman(0x1565c0, 0x42a5f5), x: -14 },
  metaclaw: { fig: buildHuman(0xe65100, 0xffab40), x: -5  },
  zeroclaw: { fig: buildHuman(0x1b5e20, 0x69f0ae), x:  5  },
  ollama:   { fig: buildHuman(0x4a148c, 0xce93d8), x:  14 },
};

Object.entries(FIGURES).forEach(([name, f]) => {
  f.fig.position.set(f.x, -2.5, 0);
  scene.add(f.fig);
  f.name = name;
});

// ── Figure labels ─────────────────────────────────────────────────────────────
function makeLabel(text, color) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 56;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#' + color.toString(16).padStart(6,'0');
  ctx.font = 'bold 26px Courier New';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#' + color.toString(16).padStart(6,'0');
  ctx.shadowBlur = 10;
  ctx.fillText(text, 128, 38);
  const tex = new THREE.CanvasTexture(c);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
  sprite.scale.set(5, 1.1, 1);
  return sprite;
}

const LABEL_COLORS = { slack: 0x42a5f5, metaclaw: 0xffab40, zeroclaw: 0x69f0ae, ollama: 0xce93d8 };
const LABEL_NAMES  = { slack: 'SLACK', metaclaw: 'METACLAW', zeroclaw: 'ZEROCLAW', ollama: 'OLLAMA' };
Object.entries(FIGURES).forEach(([name, f]) => {
  const lbl = makeLabel(LABEL_NAMES[name], LABEL_COLORS[name]);
  lbl.position.set(f.x, 1.8, 0);
  scene.add(lbl);
});

// ── Connection beams ──────────────────────────────────────────────────────────
function makeBeam(x1, x2, color) {
  const points = [new THREE.Vector3(x1, 0.5, 0), new THREE.Vector3(x2, 0.5, 0)];
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.35 });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  return mat;
}
makeBeam(-14, -5,  0x42a5f5);
makeBeam(-5,   5,  0xffab40);
makeBeam( 5,  14,  0x69f0ae);

// ── Skill orbs ────────────────────────────────────────────────────────────────
const SKILL_COLS = [0x00bcd4,0x8bc34a,0xff5722,0xe91e63,0x9c27b0,0x3f51b5,0x00acc1,0xffb300,0x6d4c41,0x546e7a];
const skillOrbs = [];
for (let i = 0; i < 136; i++) {
  const phi   = Math.acos(-1 + (2*i)/136);
  const theta = Math.sqrt(136 * Math.PI) * phi;
  const r = 6.5 + Math.random() * 2.5;
  const x = 5 + r * Math.sin(phi) * Math.cos(theta);
  const y = r * Math.sin(phi) * Math.sin(theta) * 0.5;
  const z = r * Math.cos(phi);
  const col = SKILL_COLS[i % SKILL_COLS.length];
  const mat = new THREE.MeshPhongMaterial({ color: col, emissive: col, emissiveIntensity: 0.25, transparent: true, opacity: 0.65 });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.18 + Math.random()*0.08, 7, 7), mat);
  mesh.position.set(x, y - 1, z);
  scene.add(mesh);

  const linePts = [new THREE.Vector3(5, -1, 0), new THREE.Vector3(x, y-1, z)];
  const lineGeo = new THREE.BufferGeometry().setFromPoints(linePts);
  scene.add(new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: 0.07 })));

  skillOrbs.push({ mesh, mat, baseOp: 0.65, initY: y - 1, x, z });
}

// ── Particles ─────────────────────────────────────────────────────────────────
const particles = [];
function spawnParticle(fromX, toX, color, yOffset = 0.5) {
  const count = 3;
  for (let i = 0; i < count; i++) {
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.18, 5, 5),
      new THREE.MeshBasicMaterial({ color })
    );
    scene.add(mesh);
    particles.push({
      mesh,
      fromX, toX, yOffset,
      t: -(i * 0.15),
      speed: 0.018 + Math.random() * 0.008,
      done: false,
    });
  }
}

// ── Shockwave ─────────────────────────────────────────────────────────────────
const shockwaves = [];
function spawnShockwave(x, color) {
  const mesh = new THREE.Mesh(
    new THREE.TorusGeometry(0.3, 0.08, 8, 32),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9 })
  );
  mesh.position.set(x, 0.5, 0);
  mesh.rotation.x = Math.PI / 2;
  scene.add(mesh);
  shockwaves.push({ mesh, scale: 1, opacity: 0.9 });
}

// ── Node flash ────────────────────────────────────────────────────────────────
const nodeFlashes = {};
function flashNode(name, color, duration = 40) {
  const f = FIGURES[name];
  if (!f) return;
  const ud = f.fig.userData;
  ud.mat.emissive.setHex(color);
  ud.mat.emissiveIntensity = 2.5;
  ud.accent.emissiveIntensity = 3.0;
  nodeFlashes[name] = { fig: f.fig, timer: duration };
}

function lightSkill(idx) {
  const s = skillOrbs[idx !== undefined ? idx : Math.floor(Math.random() * skillOrbs.length)];
  s.mat.emissiveIntensity = 3.0;
  s.mat.opacity = 1.0;
  setTimeout(() => { s.mat.emissiveIntensity = 0.25; s.mat.opacity = s.baseOp; }, 700);
}

// ── WebSocket ─────────────────────────────────────────────────────────────────
let stats = { msgs: 0, approved: 0, blocked: 0 };
let ws;
function connectWS() {
  ws = new WebSocket(`ws://${location.hostname}:4001`);
  ws.onmessage = e => handleEvent(JSON.parse(e.data));
  ws.onclose   = () => setTimeout(connectWS, 3000);
}

function handleEvent(ev) {
  switch(ev.type) {
    case 'message_in':
      stats.msgs++;
      document.getElementById('stat-msgs').textContent = stats.msgs;
      flashNode('slack', 0x42a5f5);
      spawnParticle(-14, -5, 0x42a5f5);
      addLog(`📨 ${ev.text || 'incoming message'}`, 'message_in');
      break;
    case 'approved':
      stats.approved++;
      document.getElementById('stat-approved').textContent = stats.approved;
      flashNode('metaclaw', 0x00ff00);
      spawnParticle(-5, 5,  0xffab40);
      spawnParticle( 5, 14, 0x69f0ae);
      for (let i = 0; i < 4; i++) setTimeout(() => lightSkill(), i * 120);
      addLog('✅ Approved → ZeroClaw', 'approved');
      break;
    case 'blocked':
      stats.blocked++;
      document.getElementById('stat-blocked').textContent = stats.blocked;
      flashNode('metaclaw', 0xff0000);
      spawnShockwave(-5, 0xff0000);
      addLog(`🛑 BLOCKED${ev.keyword ? ': '+ev.keyword : ''}`, 'blocked');
      break;
    case 'zeroclaw_call':
      flashNode('zeroclaw', 0x69f0ae);
      spawnParticle(5, -14, 0x00e5ff);
      for (let i = 0; i < 6; i++) setTimeout(() => lightSkill(), i * 80);
      break;
    case 'webhook_error':
    case 'agent_error':
    case 'provider_error':
      flashNode(ev.node || 'zeroclaw', 0xff9800);
      addLog(`⚠ Error on ${ev.node || 'agent'}`, 'error');
      break;
    case 'health':
      ['slack','metaclaw','zeroclaw','ollama'].forEach(n => {
        const dot = document.getElementById(`dot-${n}`);
        if (!dot) return;
        const s = ev.status[n] || 'offline';
        dot.className = 'dot' + (s === 'ok' ? '' : s === 'offline' ? ' offline' : ' error');
      });
      break;
  }
}

// ── Log panel ─────────────────────────────────────────────────────────────────
const logItems = [];
function addLog(text, cls) {
  const el = document.getElementById('log-entries');
  const div = document.createElement('div');
  div.className = `log-entry ${cls}`;
  div.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
  logItems.push(div);
  el.appendChild(div);
  if (logItems.length > 6) el.removeChild(logItems.shift());
}

// ── Camera orbit ──────────────────────────────────────────────────────────────
let isDrag = false, lastM = {x:0,y:0};
let sph = { theta: 0.1, phi: 1.1, r: 35 };
document.addEventListener('mousedown', e => { isDrag = true; lastM = {x: e.clientX, y: e.clientY}; });
document.addEventListener('mouseup',   () => isDrag = false);
document.addEventListener('mousemove', e => {
  if (!isDrag) return;
  sph.theta -= (e.clientX - lastM.x) * 0.008;
  sph.phi   -= (e.clientY - lastM.y) * 0.008;
  sph.phi    = Math.max(0.3, Math.min(1.5, sph.phi));
  lastM = {x: e.clientX, y: e.clientY};
});
document.addEventListener('wheel', e => {
  sph.r = Math.max(12, Math.min(70, sph.r + e.deltaY * 0.04));
});

// Touch support
document.addEventListener('touchstart', e => { isDrag = true; lastM = {x: e.touches[0].clientX, y: e.touches[0].clientY}; });
document.addEventListener('touchend',   () => isDrag = false);
document.addEventListener('touchmove',  e => {
  if (!isDrag) return;
  sph.theta -= (e.touches[0].clientX - lastM.x) * 0.008;
  sph.phi   -= (e.touches[0].clientY - lastM.y) * 0.008;
  lastM = {x: e.touches[0].clientX, y: e.touches[0].clientY};
});

// ── Animate humans ────────────────────────────────────────────────────────────
function animateHuman(ud, t) {
  const s = ud.animSpeed, p = ud.phase;
  const idleY = Math.sin(t * s + p) * 0.04;

  // Idle breathing bob
  if (ud.luArm) {
    ud.luArm.rotation.z = -0.3 + Math.sin(t * s + p) * 0.12;
    ud.ruArm.rotation.z =  0.3 - Math.sin(t * s + p) * 0.12;
    ud.llArm.rotation.z = ud.luArm.rotation.z * 0.8;
    ud.rlArm.rotation.z = ud.ruArm.rotation.z * 0.8;
    ud.lThigh.rotation.x = Math.sin(t * s * 0.5 + p) * 0.08;
    ud.rThigh.rotation.x = -Math.sin(t * s * 0.5 + p) * 0.08;
    ud.head.rotation.y   = Math.sin(t * 0.3 + p) * 0.15;
    ud.ring.rotation.z   = t * 1.5;
  }
  return idleY;
}

// ── Animation loop ─────────────────────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Camera
  camera.position.x = sph.r * Math.sin(sph.phi) * Math.sin(sph.theta);
  camera.position.y = sph.r * Math.cos(sph.phi) + 4;
  camera.position.z = sph.r * Math.sin(sph.phi) * Math.cos(sph.theta);
  camera.lookAt(0, 1, 0);

  // Animate humans
  Object.values(FIGURES).forEach(f => {
    const ud = f.fig.userData;
    const dy = animateHuman(ud, t);
    f.fig.position.y = -2.5 + dy;
  });

  // Flash decay
  Object.entries(nodeFlashes).forEach(([name, fl]) => {
    fl.timer--;
    if (fl.timer <= 0) {
      const ud = fl.fig.userData;
      ud.mat.emissive.setHex(ud.baseColor);
      ud.mat.emissiveIntensity = 0.3;
      ud.accent.emissiveIntensity = 0.6;
      delete nodeFlashes[name];
    }
  });

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += p.speed;
    if (p.t < 0) { p.mesh.visible = false; continue; }
    p.mesh.visible = true;
    if (p.t >= 1) { scene.remove(p.mesh); particles.splice(i, 1); continue; }
    const x = p.fromX + (p.toX - p.fromX) * p.t;
    const arc = Math.sin(p.t * Math.PI) * 1.5;
    p.mesh.position.set(x, p.yOffset + arc, Math.sin(p.t * Math.PI * 2) * 0.3);
  }

  // Shockwaves
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i];
    sw.scale += 0.12;
    sw.opacity -= 0.028;
    sw.mesh.scale.setScalar(sw.scale);
    sw.mesh.material.opacity = Math.max(0, sw.opacity);
    if (sw.opacity <= 0) { scene.remove(sw.mesh); shockwaves.splice(i, 1); }
  }

  // Skill orbs pulse + orbit
  skillOrbs.forEach((s, i) => {
    const pulse = 0.5 + 0.5 * Math.sin(t * 0.7 + i * 0.25);
    s.mat.opacity = s.baseOp * (0.5 + 0.5 * pulse);
    // Slow orbit around ZeroClaw
    const angle = t * 0.05 + i * 0.046;
    const r = Math.sqrt((s.x - 5)**2 + s.z**2);
    s.mesh.position.x = 5 + r * Math.cos(angle);
    s.mesh.position.z =     r * Math.sin(angle);
  });

  // Matrix rain
  const rPos = rain.geometry.attributes.position;
  for (let i = 0; i < rainSpeeds.length; i++) {
    rPos.array[i * 3 + 1] -= rainSpeeds[i];
    if (rPos.array[i * 3 + 1] < -10) rPos.array[i * 3 + 1] = 50;
  }
  rPos.needsUpdate = true;

  // Grid pulse
  grid.material.opacity = 0.3 + 0.2 * Math.sin(t * 0.5);

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── Boot ──────────────────────────────────────────────────────────────────────
setTimeout(() => {
  document.getElementById('loading').style.opacity = '0';
  setTimeout(() => document.getElementById('loading').remove(), 1000);
  connectWS();
  animate();
  addLog('3D Monitor online', 'info');
  addLog('Watching pipeline...', 'info');
}, 2200);
</script>
</body>
