<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZeroClaw 3D Monitor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: #0ff; }
  #canvas { display: block; }

  #hud {
    position: fixed; top: 20px; left: 20px;
    background: rgba(0,0,0,0.7);
    border: 1px solid #0ff4;
    border-radius: 8px;
    padding: 14px 18px;
    min-width: 220px;
    font-size: 12px;
    line-height: 1.8;
    pointer-events: none;
  }
  #hud h2 { color: #0ff; font-size: 14px; margin-bottom: 8px; letter-spacing: 2px; }
  .node-status { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #0f0; }
  .dot.offline { background: #f00; }
  .dot.error   { background: #ff0; }

  #log {
    position: fixed; bottom: 20px; left: 20px;
    background: rgba(0,0,0,0.7);
    border: 1px solid #0ff4;
    border-radius: 8px;
    padding: 10px 14px;
    width: 420px;
    font-size: 11px;
    line-height: 1.6;
    max-height: 160px;
    overflow: hidden;
  }
  #log h3 { color: #0ff; margin-bottom: 6px; font-size: 11px; letter-spacing: 1px; }
  .log-entry { opacity: 0.85; }
  .log-entry.blocked { color: #f44; }
  .log-entry.approved { color: #4f4; }
  .log-entry.message_in { color: #4af; }
  .log-entry.error { color: #fa4; }

  #title {
    position: fixed; top: 20px; right: 20px;
    text-align: right;
    pointer-events: none;
  }
  #title h1 { font-size: 22px; color: #0ff; letter-spacing: 4px; text-shadow: 0 0 20px #0ff8; }
  #title p  { font-size: 11px; color: #0ff8; letter-spacing: 2px; }

  #stats {
    position: fixed; bottom: 20px; right: 20px;
    background: rgba(0,0,0,0.7);
    border: 1px solid #0ff4;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    line-height: 1.8;
    text-align: right;
  }
  #stats h3 { color: #0ff; font-size: 11px; letter-spacing: 1px; margin-bottom: 4px; }
  .stat-val { color: #fff; }
  .stat-blocked { color: #f44; }
</style>
</head>
<body>

<div id="hud">
  <h2>⬡ NODE STATUS</h2>
  <div class="node-status"><span class="dot" id="dot-slack"></span>  Slack Bridge</div>
  <div class="node-status"><span class="dot" id="dot-metaclaw"></span>  MetaClaw</div>
  <div class="node-status"><span class="dot" id="dot-zeroclaw"></span>  ZeroClaw</div>
  <div class="node-status"><span class="dot" id="dot-ollama"></span>  Ollama</div>
</div>

<div id="title">
  <h1>ZEROCLAW</h1>
  <p>3D PIPELINE MONITOR</p>
</div>

<div id="log">
  <h3>▶ LIVE EVENTS</h3>
  <div id="log-entries"></div>
</div>

<div id="stats">
  <h3>SESSION STATS</h3>
  Messages: <span class="stat-val" id="stat-msgs">0</span><br>
  Approved: <span class="stat-val" id="stat-approved">0</span><br>
  Blocked:  <span class="stat-blocked" id="stat-blocked">0</span><br>
  Skills:   <span class="stat-val">136</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
// ── Scene setup ──────────────────────────────────────────────────────────────
const W = window.innerWidth, H = window.innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);
renderer.domElement.id = 'canvas';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000510);
scene.fog = new THREE.FogExp2(0x000510, 0.015);

const camera = new THREE.PerspectiveCamera(60, W/H, 0.1, 1000);
camera.position.set(0, 8, 28);
camera.lookAt(0, 0, 0);

// Ambient + point lights
scene.add(new THREE.AmbientLight(0x112233, 2));
const pLight = new THREE.PointLight(0x00ffff, 1.5, 80);
pLight.position.set(0, 10, 0);
scene.add(pLight);

// ── Stars ─────────────────────────────────────────────────────────────────────
const starGeo = new THREE.BufferGeometry();
const starVerts = [];
for (let i = 0; i < 3000; i++) {
  starVerts.push((Math.random()-0.5)*400, (Math.random()-0.5)*400, (Math.random()-0.5)*400);
}
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVerts, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.3 })));

// ── Pipeline node helper ──────────────────────────────────────────────────────
function makeNode(x, y, z, color, label, size = 1.2) {
  const geo = new THREE.IcosahedronGeometry(size, 1);
  const mat = new THREE.MeshPhongMaterial({
    color, emissive: color, emissiveIntensity: 0.4,
    transparent: true, opacity: 0.9, wireframe: false,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  scene.add(mesh);

  // Glow ring
  const ringGeo = new THREE.TorusGeometry(size * 1.5, 0.05, 8, 32);
  const ringMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.3 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.set(x, y, z);
  ring.rotation.x = Math.PI / 2;
  scene.add(ring);

  // Sprite label
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#' + color.toString(16).padStart(6,'0');
  ctx.font = 'bold 28px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText(label, 128, 40);
  const tex = new THREE.CanvasTexture(canvas);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
  sprite.position.set(x, y + size + 1.2, z);
  sprite.scale.set(4, 1, 1);
  scene.add(sprite);

  return { mesh, mat, ring, ringMat, x, y, z, color, baseColor: color };
}

// ── Pipeline nodes ────────────────────────────────────────────────────────────
const NODES = {
  slack:     makeNode(-12,  0, 0, 0x2196f3, 'SLACK',     1.3),
  metaclaw:  makeNode( -4,  0, 0, 0xff9800, 'METACLAW',  1.4),
  zeroclaw:  makeNode(  4,  0, 0, 0x00e676, 'ZEROCLAW',  1.5),
  ollama:    makeNode( 12,  0, 0, 0x9c27b0, 'OLLAMA',    1.3),
};

// ── Pipeline connection lines ─────────────────────────────────────────────────
function makeLine(n1, n2, color) {
  const points = [
    new THREE.Vector3(n1.x, n1.y, n1.z),
    new THREE.Vector3(n2.x, n2.y, n2.z),
  ];
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.4 });
  scene.add(new THREE.Line(geo, mat));
  return mat;
}
makeLine(NODES.slack,    NODES.metaclaw, 0x2196f3);
makeLine(NODES.metaclaw, NODES.zeroclaw, 0xff9800);
makeLine(NODES.zeroclaw, NODES.ollama,   0x00e676);

// ── Skill nodes (136 in galaxy around ZeroClaw) ───────────────────────────────
const SKILL_COLORS = [
  0x00bcd4, 0x8bc34a, 0xff5722, 0xe91e63, 0x9c27b0,
  0x3f51b5, 0x00acc1, 0xffb300, 0x6d4c41, 0x546e7a,
];
const skillMeshes = [];
const NUM_SKILLS = 136;
for (let i = 0; i < NUM_SKILLS; i++) {
  const phi   = Math.acos(-1 + (2 * i) / NUM_SKILLS);
  const theta = Math.sqrt(NUM_SKILLS * Math.PI) * phi;
  const r = 7 + Math.random() * 2;
  const x = NODES.zeroclaw.x + r * Math.sin(phi) * Math.cos(theta);
  const y = r * Math.sin(phi) * Math.sin(theta) * 0.6;
  const z = r * Math.cos(phi);
  const color = SKILL_COLORS[i % SKILL_COLORS.length];
  const geo = new THREE.SphereGeometry(0.18, 6, 6);
  const mat = new THREE.MeshPhongMaterial({ color, emissive: color, emissiveIntensity: 0.2, transparent: true, opacity: 0.7 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  scene.add(mesh);

  // thin line to ZeroClaw
  const linePts = [new THREE.Vector3(NODES.zeroclaw.x, 0, 0), new THREE.Vector3(x, y, z)];
  const lineGeo = new THREE.BufferGeometry().setFromPoints(linePts);
  const lineMat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.08 });
  scene.add(new THREE.Line(lineGeo, lineMat));

  skillMeshes.push({ mesh, mat, baseOpacity: 0.7 });
}

// ── Particle pulse along pipeline ─────────────────────────────────────────────
const particles = [];
function spawnParticle(fromNode, toNode, color) {
  const geo = new THREE.SphereGeometry(0.25, 4, 4);
  const mat = new THREE.MeshBasicMaterial({ color });
  const mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);
  particles.push({ mesh, from: new THREE.Vector3(fromNode.x, fromNode.y, fromNode.z),
                   to:   new THREE.Vector3(toNode.x,   toNode.y,   toNode.z),
                   t: 0, speed: 0.025 });
}

// ── Flash node ────────────────────────────────────────────────────────────────
const nodeFlashes = {};
function flashNode(name, color) {
  const node = NODES[name];
  if (!node) return;
  node.mat.emissive.setHex(color);
  node.mat.emissiveIntensity = 2.0;
  nodeFlashes[name] = { timer: 30, node };
}

// ── Light random skill node ───────────────────────────────────────────────────
function lightSkill() {
  const s = skillMeshes[Math.floor(Math.random() * skillMeshes.length)];
  s.mat.emissiveIntensity = 2.5;
  s.mat.opacity = 1.0;
  setTimeout(() => { s.mat.emissiveIntensity = 0.2; s.mat.opacity = s.baseOpacity; }, 600);
}

// ── WebSocket ─────────────────────────────────────────────────────────────────
let stats = { msgs: 0, approved: 0, blocked: 0 };
const wsUrl = `ws://${location.hostname}:4001`;
let ws;

function connectWS() {
  ws = new WebSocket(wsUrl);
  ws.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    handleEvent(ev);
  };
  ws.onclose = () => setTimeout(connectWS, 3000);
}

function handleEvent(ev) {
  switch(ev.type) {
    case 'message_in':
      stats.msgs++;
      document.getElementById('stat-msgs').textContent = stats.msgs;
      flashNode('slack', 0x2196f3);
      spawnParticle(NODES.slack, NODES.metaclaw, 0x2196f3);
      addLog(`📨 ${ev.text || 'message'}`, 'message_in');
      break;

    case 'approved':
      stats.approved++;
      document.getElementById('stat-approved').textContent = stats.approved;
      flashNode('metaclaw', 0x00ff00);
      spawnParticle(NODES.metaclaw, NODES.zeroclaw, 0x00e676);
      spawnParticle(NODES.zeroclaw, NODES.ollama,   0x9c27b0);
      lightSkill();
      addLog('✅ Approved — routed to ZeroClaw', 'approved');
      break;

    case 'blocked':
      stats.blocked++;
      document.getElementById('stat-blocked').textContent = stats.blocked;
      flashNode('metaclaw', 0xff0000);
      addLog(`🛑 BLOCKED${ev.keyword ? ': '+ev.keyword : ''}`, 'blocked');
      break;

    case 'zeroclaw_call':
      flashNode('zeroclaw', 0x00e676);
      spawnParticle(NODES.zeroclaw, NODES.slack, 0x2196f3);
      lightSkill(); lightSkill();
      break;

    case 'webhook_error':
    case 'agent_error':
    case 'provider_error':
      flashNode(ev.node || 'zeroclaw', 0xff9800);
      addLog(`⚠ Error on ${ev.node}`, 'error');
      break;

    case 'health':
      ['slack','metaclaw','zeroclaw','ollama'].forEach(n => {
        const dot = document.getElementById(`dot-${n}`);
        if (!dot) return;
        const s = ev.status[n] || 'offline';
        dot.className = 'dot' + (s === 'ok' ? '' : s === 'offline' ? ' offline' : ' error');
      });
      break;
  }
}

// ── Log panel ─────────────────────────────────────────────────────────────────
const LOG_MAX = 6;
const logEntries = [];
function addLog(text, cls) {
  const el = document.getElementById('log-entries');
  const div = document.createElement('div');
  div.className = `log-entry ${cls}`;
  div.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
  logEntries.push(div);
  el.appendChild(div);
  if (logEntries.length > LOG_MAX) {
    el.removeChild(logEntries.shift());
  }
}

// ── Orbit camera (manual drag) ────────────────────────────────────────────────
let isDragging = false, lastMouse = { x: 0, y: 0 };
let spherical = { theta: 0, phi: Math.PI / 3, r: 28 };
document.addEventListener('mousedown', e => { isDragging = true; lastMouse = { x: e.clientX, y: e.clientY }; });
document.addEventListener('mouseup',   () => isDragging = false);
document.addEventListener('mousemove', e => {
  if (!isDragging) return;
  spherical.theta -= (e.clientX - lastMouse.x) * 0.01;
  spherical.phi   -= (e.clientY - lastMouse.y) * 0.01;
  spherical.phi    = Math.max(0.2, Math.min(Math.PI - 0.2, spherical.phi));
  lastMouse = { x: e.clientX, y: e.clientY };
});
document.addEventListener('wheel', e => {
  spherical.r = Math.max(10, Math.min(60, spherical.r + e.deltaY * 0.05));
});

// ── Animation loop ─────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Orbit camera
  camera.position.x = spherical.r * Math.sin(spherical.phi) * Math.sin(spherical.theta);
  camera.position.y = spherical.r * Math.cos(spherical.phi);
  camera.position.z = spherical.r * Math.sin(spherical.phi) * Math.cos(spherical.theta);
  camera.lookAt(0, 0, 0);

  // Rotate pipeline nodes
  Object.values(NODES).forEach((n, i) => {
    n.mesh.rotation.y = t * 0.4 + i;
    n.ring.rotation.z = t * 0.6 + i;
  });

  // Rotate skill cloud
  skillMeshes.forEach((s, i) => {
    s.mesh.rotation.y = t * 0.2;
  });

  // Flash decay
  Object.entries(nodeFlashes).forEach(([name, f]) => {
    f.timer--;
    if (f.timer <= 0) {
      f.node.mat.emissive.setHex(f.node.color);
      f.node.mat.emissiveIntensity = 0.4;
      delete nodeFlashes[name];
    }
  });

  // Move particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += p.speed;
    if (p.t >= 1) {
      scene.remove(p.mesh);
      particles.splice(i, 1);
      continue;
    }
    p.mesh.position.lerpVectors(p.from, p.to, p.t);
  }

  // Skill cloud slow pulse
  skillMeshes.forEach((s, i) => {
    const pulse = 0.5 + 0.5 * Math.sin(t * 0.8 + i * 0.3);
    s.mat.opacity = s.baseOpacity * (0.6 + 0.4 * pulse);
  });

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

connectWS();
animate();
</script>
</body>
</html>
